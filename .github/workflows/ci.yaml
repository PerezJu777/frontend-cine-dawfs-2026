name: CI Frontend Cine

on:
  push:
    branches: [main]

env:
  IMAGEN: ${{ secrets.DOCKER_USERNAME }}/front-cine:${{ github.sha }}

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      # - name: ejecutar-pruebas
      #   run: npm test

  docker:
    needs: pruebas
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: docker-build
        run: docker build -f ./Dockerfile -t "$IMAGEN" .

      - name: Iniciar sesion en Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Subir imagen a Docker Hub
        run: |
          docker push "$IMAGEN"
          echo "Imagen subida a Docker Hub: $IMAGEN"

  despliegue:
    needs: docker
    runs-on: ubuntu-latest
    steps:
      - name: Desplegar Frontend y Nginx en el servidor por SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          envs: IMAGEN,DOCKER_USERNAME,DOCKER_PASSWORD
          script: |
            set -e
            CONTENEDOR_FRONT=cine-front
            CONTENEDOR_NGINX=nginx-prod
            IMAGEN_NGINX=nginx:alpine
            RED=cine-red

            mkdir -p "$HOME/cine/nginx"

            docker network inspect "$RED" >/dev/null 2>&1 || docker network create "$RED"

            if [ ! -f "$HOME/cine/nginx/nginx.conf" ]; then
              cat << 'EOF' > "$HOME/cine/nginx/nginx.conf"
events {
  worker_connections 1024;
}

http {
  server {
    listen 80;
    server_name _;

    location / {
      proxy_pass http://cine-front:80;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
      proxy_pass http://api-cine-prod:3000/api/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
EOF
            fi

            echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin

            echo "Descargando $IMAGEN y $IMAGEN_NGINX"
            docker pull "$IMAGEN"
            docker pull "$IMAGEN_NGINX"

            PREV_IMG=$(docker inspect -f '{{.Config.Image}}' "$CONTENEDOR_FRONT" 2>/dev/null || true)
            if [ -n "$PREV_IMG" ] && [ "$PREV_IMG" != "$IMAGEN" ] && docker image inspect "$PREV_IMG" >/dev/null 2>&1; then
              docker tag "$PREV_IMG" "${IMAGEN%:*}:previous" || true
            fi

            if docker ps -a --format '{{.Names}}' | grep -qx "$CONTENEDOR_FRONT"; then
              docker stop "$CONTENEDOR_FRONT"
              docker rm "$CONTENEDOR_FRONT"
            fi

            docker run -d \
              --name "$CONTENEDOR_FRONT" \
              --restart unless-stopped \
              --network "$RED" \
              "$IMAGEN"

            if docker ps -a --format '{{.Names}}' | grep -qx "$CONTENEDOR_NGINX"; then
              docker stop "$CONTENEDOR_NGINX"
              docker rm "$CONTENEDOR_NGINX"
            fi

            docker run -d \
              --name "$CONTENEDOR_NGINX" \
              --restart unless-stopped \
              --network "$RED" \
              -p 80:80 \
              -v "$HOME/cine/nginx/nginx.conf:/etc/nginx/nginx.conf:ro" \
              "$IMAGEN_NGINX"

            docker logout

            docker inspect -f '{{.State.Running}}' "$CONTENEDOR_FRONT" | grep -qx "true"
            docker inspect -f '{{.State.Running}}' "$CONTENEDOR_NGINX" | grep -qx "true"
            curl -fsS http://localhost:80 >/dev/null